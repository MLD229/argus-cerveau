name: argus-veille
version: 0.1.0
description: >-
  ARGUS — VEILLE. Agent de recherche lourde et réutilisable. Ne parle PAS au
  client : travaille en arrière-plan, produit des rapports, dépose ses
  résultats dans le sous-cerveau. Le CHEF est le seul à parler au client.
hermes_requires: ">=0.19.0"
author: MLD229
license: MIT

env_requires:
  - name: DEEPSEEK_API_KEY
    description: "Clé API DeepSeek (modèle du profil)."
    required: true

distribution_owned:
  - SOUL.md
  - config.yaml
