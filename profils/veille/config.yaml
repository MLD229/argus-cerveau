model:
  default: deepseek-flash
  provider: deepseek
  base_url: https://api.deepseek.com/v1
agent:
  max_turns: 150
display:
  tool_progress: all
_config_version: 50
session_reset:
  mode: none
discord:
  history_backfill: false
  history_backfill_limit: 10
  reactions: false
compression:
  threshold: 0.4
  protect_last_n: 15
  protect_first_n: 2
onboarding:
  seen:
    busy_input_prompt: true
    tool_progress_prompt: true
approvals:
  destructive_slash_confirm: false
